<app-side-drawer
  [isOpen]="isOpen()"
  [title]="user() ? ('auth.profile' | transloco) : ('auth.signIn' | transloco)"
  width="min(400px, 100vw)"
  (closeDrawer)="close()"
>
  @if (!isAuthenticated()) {
    <!-- Login/Register Tabs for unauthenticated users -->
    <mat-tab-group [(selectedIndex)]="selectedTab" class="auth-tabs">
      <mat-tab [label]="'auth.signIn' | transloco">
        <div class="tab-content">
          <app-login />
        </div>
      </mat-tab>

      <mat-tab [label]="'auth.register' | transloco">
        <div class="tab-content">
          <app-register />
        </div>
      </mat-tab>
    </mat-tab-group>
  } @else {
    <!-- Profile for authenticated users -->
    <app-profile />
  }

  <!-- Footer -->
  <div footer>
    <p class="auth-hint">
      {{ user()?.email }}
    </p>
  </div>
</app-side-drawer>
