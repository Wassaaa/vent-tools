<div
  class="total-bar"
  [class.has-entries]="hasEntries()"
  (click)="onTap()"
  role="button"
  tabindex="0"
  [attr.aria-label]="'workLog.openLog' | transloco"
  *transloco="let t"
>
  <!-- Header Title (Corner) -->
  <div class="header-title">
    <span class="work-log-label">{{ t("workLog.title") }}</span>
    <span class="company-context">
      {{ dayContext().name || t("workLog.personalWork") }}
    </span>
  </div>

  <!-- Recent Activity Tags -->
  <div
    class="recent-activity"
    [@listAnimation]="animationTrigger()"
    [@.disabled]="animationsDisabled()"
  >
    @for (tag of latestEntries(); track tag.id) {
      <div class="activity-tag">
        <span class="tag-size">{{ tag.sizeDisplay }}</span>
        <span class="tag-type">{{ formatType(tag.type) }}</span>
        <span class="tag-amount">x{{ tag.amount }}</span>
      </div>
    }
  </div>

  <!-- Totals Group -->
  <div class="totals-group">
    <!-- Total hours -->
    <div class="total-hours">
      <span class="hours-value">{{ totalNormHours() | duration }}</span>
      <span class="hours-label">NH</span>
    </div>

    <!-- Expand indicator -->
    <div class="expand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" />
      </svg>
    </div>
  </div>
</div>
