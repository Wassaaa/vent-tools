<div class="app-container" *transloco="let t">
  <!-- Minimal Header -->
  <header class="app-header">
    <span class="app-title">{{ t("app.title") }}</span>

    <!-- Date Navigation (Center) -->
    <app-date-nav />

    <div class="header-actions">
      <!-- Language Switcher -->
      <app-header-btn
        icon="language"
        [label]="t('settings.language')"
        [menu]="langMenu"
      />
      <mat-menu #langMenu="matMenu">
        @for (lang of languages; track lang.value) {
          <button
            mat-menu-item
            (click)="setLanguage(lang.value)"
            [class.active-lang]="currentLanguage() === lang.value"
          >
            <span>{{ lang.label }}</span>
          </button>
        }
      </mat-menu>

      <!-- Theme Toggle -->
      <app-header-btn
        [icon]="isDarkMode() ? 'light_mode' : 'dark_mode'"
        [label]="t('settings.toggleTheme')"
        (action)="toggleTheme()"
      />

      <!-- Auth Button & Worker Name -->
      <div class="auth-wrapper">
        <app-header-btn
          icon="account_circle"
          [label]="t('auth.account')"
          (action)="openAuth()"
        />
        <span class="worker-name">{{ workerNameDisplay() }}</span>
      </div>

      <!-- Manager/Worker Dashboard Button -->
      @if (isAuthenticated()) {
        <app-header-btn
          [icon]="isManager() ? 'dashboard' : 'folder_shared'"
          [label]="
            t(
              isManager() ? 'titles.dashboard' : 'manager.dashboard.workerTitle'
            )
          "
          link="/manager/dashboard"
          (click)="closeAllDrawers()"
        />
      }

      <!-- Settings Button -->
      <app-header-btn
        icon="settings"
        [label]="t('settings.openSettings')"
        (action)="openSettings()"
      />
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="nav-tabs">
    @for (tab of navTabs; track tab.path) {
      <a
        mat-tab-link
        [routerLink]="tab.path"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive"
        class="nav-tab"
      >
        <mat-icon>{{ tab.icon }}</mat-icon>
        <span class="tab-label">{{ t(tab.labelKey) }}</span>
      </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet />
  </main>

  <!-- Shared Backdrop -->
  @if (anyDrawerOpen()) {
    <div class="drawer-backdrop" (click)="closeAllDrawers()"></div>
  }

  <!-- Total Bar (sticky bottom) -->
  <app-total-bar (openLog)="openWorkLog()" (editNhRate)="onEditNhRate()" />

  <!-- Settings Drawer -->
  <app-settings-drawer
    [isOpen]="settingsOpen()"
    (closeDrawer)="closeSettings()"
  />

  <!-- Daily Work Sheet (Unified) -->
  <app-daily-work-sheet
    [isOpen]="workLogOpen()"
    mode="worker"
    [localEntries]="localEntries()"
    [cloudEntry]="cloudEntry()"
    [contextName]="sheetContext()"
    [isAuthenticated]="isAuthenticated()"
    [activeCompanyName]="activeCompanyName()"
    (close)="closeWorkLog()"
    (deleteEntry)="handleDeleteEntry($event)"
    (clearAll)="handleClearAll()"
    (revise)="handleRevise()"
    (moveToCloud)="handleMoveToCloud()"
  />

  <!-- Auth Drawer -->
  <app-auth-drawer [isOpen]="authOpen()" (closeDrawer)="closeAuth()" />
</div>
