name: Deploy to Amplify
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Verify Build Output
        run: |
          # UPDATED PATH: dist/vent/browser
          if [ ! -f "dist/vent/browser/index.html" ]; then
            echo "ERROR: index.html not found in dist/vent/browser!"
            echo "Listing dist folder:"
            ls -R dist
            exit 1
          fi

      - name: Deploy to Amplify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AWS_REGION: eu-north-1
        run: |
          # 1. Zip the build output (cd avoids parent folders in zip)
          cd dist/vent/browser
          zip -r ../../deploy.zip .
          cd ../..

          # 2. Create Deployment & Capture Output
          # We save the output to a file so we can read the IDs reliably
          echo "Creating deployment..."
          aws amplify create-deployment \
            --app-id $AMPLIFY_APP_ID \
            --branch-name main \
            > deploy_info.json

          # 3. Extract URL and JobID using jq
          UPLOAD_URL=$(jq -r '.zipUploadUrl' deploy_info.json)
          JOB_ID=$(jq -r '.jobId' deploy_info.json)

          echo "Job ID: $JOB_ID"
          
          # 4. Upload the Zip File
          echo "Uploading file..."
          curl -f -X PUT "$UPLOAD_URL" --data-binary @deploy.zip -H "Content-Type: application/zip"

          # 5. Start the Deployment
          echo "Starting deployment..."
          aws amplify start-deployment \
            --app-id $AMPLIFY_APP_ID \
            --branch-name main \
            --job-id "$JOB_ID"
